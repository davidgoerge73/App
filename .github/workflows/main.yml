name: Build Kivy APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # 1. إعداد بيئة Java الحديثة (Java 17) المتوافقة مع Android NDK/SDK
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # 2. تثبيت التبعيات وأدوات البناء
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython

      # 3. الموافقة التلقائية على جميع تراخيص Android SDK
      - name: Accept Android SDK Licenses Automatically
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | buildozer android debug || true

      # 4. بناء ملف الـ APK النهائي
      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      # 5. رفع ملف الـ APK الجاهز للتحميل
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Kivy-App-APK
          path: bin/*.apk
